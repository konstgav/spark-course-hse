# =============================================================================
# spark-defaults.conf для driver'ов, работающих ВНУТРИ docker-сети:
#   - spark-submit / spark-sql / pyspark внутри контейнеров Spark;
#   - spark-submit из Airflow (SPARK_CONF_DIR=/opt/spark-conf).
# Для JupyterLab на хост-машине параметры задаются в коде — см. README.md
# и host/spark_session.py (там другие адреса master/metastore).
# =============================================================================

spark.master                                   spark://spark-master:7077

# --- Jar-пакеты из Maven Central (кешируются в ~/.ivy2) ----------------------
# iceberg-spark-runtime : формат таблиц Iceberg
# catboost-spark        : распределённое обучение CatBoost на Spark DataFrame
# postgresql            : JDBC-драйвер для записи витрин в Postgres (база dwh)
spark.jars.packages                            org.apache.iceberg:iceberg-spark-runtime-3.5_2.12:1.10.1,ai.catboost:catboost-spark_3.5_2.12:1.2.10,org.postgresql:postgresql:42.7.8

# --- Iceberg: SQL-расширения (MERGE INTO, CALL, time travel) -----------------
spark.sql.extensions                           org.apache.iceberg.spark.extensions.IcebergSparkSessionExtensions

# --- Каталог "iceberg": Hive Metastore + данные в HDFS -----------------------
spark.sql.catalog.iceberg                      org.apache.iceberg.spark.SparkCatalog
spark.sql.catalog.iceberg.type                 hive
spark.sql.catalog.iceberg.uri                  thrift://hive-metastore:9083
spark.sql.catalog.iceberg.warehouse            hdfs://namenode:9000/warehouse
spark.hadoop.fs.defaultFS                      hdfs://namenode:9000

# --- Ресурсы одного приложения ----------------------------------------------
# 2 executor'а по 2 ядра/2g: по одному на каждом воркере. Одно приложение
# занимает весь кластер (4 ядра), следующее ждёт, пока оно не завершится.
spark.executor.memory                          2g
spark.executor.cores                           2
spark.cores.max                                4
spark.sql.shuffle.partitions                   8

spark.sql.session.timeZone                     Europe/Moscow
