<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="486" viewBox="0 0 1080 486" role="img"
     aria-label="Схема учебного стенда: PySpark driver на хост-машине подключается к Spark, Hive Metastore и HDFS в контейнерах Docker; Airflow и Metabase работают рядом">
  <style>
    .lbl  { font: 700 12.5px "Segoe UI","PT Sans","Noto Sans",Arial,sans-serif; letter-spacing: 1.6px; }
    .ttl  { font: 600 15.5px "Segoe UI","PT Sans","Noto Sans",Arial,sans-serif; fill: #0f2d69; }
    .ttlh { font: 600 15.5px "Segoe UI","PT Sans","Noto Sans",Arial,sans-serif; fill: #c0272d; }
    .env  { font: 700 14px "Segoe UI","PT Sans","Noto Sans",Arial,sans-serif; fill: #ffffff; letter-spacing: .3px; }
    .sub  { font: 400 11.5px "Segoe UI","PT Sans","Noto Sans",Arial,sans-serif; fill: #5b657a; }
    .wire { font: 600 11.5px "Cascadia Code",Consolas,"DejaVu Sans Mono",monospace; fill: #2b4a8b; }
    .edge  { fill: none; stroke: #2b4a8b; stroke-width: 2; }
    .inner { fill: none; stroke: #7fa3d6; stroke-width: 1.8; }
  </style>

  <defs>
    <marker id="a" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="8" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 4 L0 8 z" fill="#2b4a8b"/>
    </marker>
    <marker id="b" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 4 L0 8 z" fill="#7fa3d6"/>
    </marker>
  </defs>

  <!-- ====================== ПАНЕЛИ (нижний слой) ======================== -->
  <text class="lbl" x="18"  y="46" fill="#c0272d">ХОСТ-МАШИНА СТУДЕНТА</text>
  <rect x="16" y="58" width="200" height="412" rx="12" fill="#fff8f8" stroke="#c0272d" stroke-width="1.8" stroke-dasharray="7 5"/>

  <text class="lbl" x="432" y="46" fill="#0f2d69">DOCKER COMPOSE · СЕТЬ 172.28.0.0/24</text>
  <rect x="430" y="58" width="634" height="412" rx="12" fill="#f7faff" stroke="#0f2d69" stroke-width="1.8" stroke-dasharray="7 5"/>

  <!-- ====================== БЛОКИ НА ХОСТЕ ============================== -->
  <!-- conda-окружение: рамка с залитым заголовком вокруг всего, что в нём запускается -->
