  <rect x="16" y="58" width="200" height="388" rx="12" fill="#fff8f8" stroke="#c0272d" stroke-width="1.8" stroke-dasharray="7 5"/>

  <text class="lbl" x="432" y="46" fill="#0f2d69">DOCKER COMPOSE · СЕТЬ 172.28.0.0/24</text>
  <rect x="430" y="58" width="634" height="388" rx="12" fill="#f7faff" stroke="#0f2d69" stroke-width="1.8" stroke-dasharray="7 5"/>

