  <text class="sub"  x="48" y="221">host/spark_session.py</text>
  <text class="sub"  x="48" y="238">Spark UI :4040</text>

  <rect x="30" y="276" width="172" height="54" rx="8" fill="#ffffff" stroke="#e8a9af" stroke-width="1.4"/>
