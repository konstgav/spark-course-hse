  <path d="M24 94 V74 Q24 66 32 66 H200 Q208 66 208 74 V94 Z" fill="#c0272d"/>
  <text class="env" x="116" y="85" text-anchor="middle">conda: spark-course</text>

  <rect x="30" y="104" width="172" height="54" rx="8" fill="#ffffff" stroke="#e8a9af" stroke-width="1.4"/>
  <rect x="30" y="105" width="4"   height="52" rx="2" fill="#c0272d"/>
  <text class="ttlh" x="48" y="128">JupyterLab</text>
  <text class="sub"  x="48" y="145">браузер :8888</text>

  <rect x="30" y="184" width="172" height="74" rx="8" fill="#ffffff" stroke="#e8a9af" stroke-width="1.4"/>
  <rect x="30" y="185" width="4"   height="72" rx="2" fill="#c0272d"/>
  <text class="ttlh" x="48" y="210">PySpark driver</text>
  <text class="sub"  x="48" y="229">host/spark_session.py</text>
  <text class="sub"  x="48" y="246">Spark UI :4040</text>

  <rect x="30" y="284" width="172" height="54" rx="8" fill="#ffffff" stroke="#e8a9af" stroke-width="1.4"/>
  <rect x="30" y="285" width="4"   height="52" rx="2" fill="#c0272d"/>
  <text class="ttlh" x="48" y="308">smoke_test.py</text>
  <text class="sub"  x="48" y="325">проверка стенда</text>

  <text class="sub" x="116" y="364" text-anchor="middle">Python 3.11 · Java 17</text>
  <text class="sub" x="116" y="378" text-anchor="middle">pyspark 3.5.8</text>

  <text class="sub" x="32" y="412">winutils (только Windows)</text>

