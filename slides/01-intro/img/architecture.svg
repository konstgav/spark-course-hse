  <text class="ttlh" x="48" y="120">JupyterLab</text>
  <text class="sub"  x="48" y="137">браузер :8888</text>

  <rect x="30" y="176" width="172" height="74" rx="8" fill="#ffffff" stroke="#e8a9af" stroke-width="1.4"/>
  <rect x="30" y="177" width="4"   height="72" rx="2" fill="#c0272d"/>
