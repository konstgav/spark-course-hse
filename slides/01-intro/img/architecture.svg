<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="462" viewBox="0 0 1080 462" role="img"
     aria-label="Схема учебного стенда: PySpark driver на хост-машине подключается к Spark, Hive Metastore и HDFS в контейнерах Docker">
  <style>
    .lbl  { font: 700 12.5px "Segoe UI","PT Sans","Noto Sans",Arial,sans-serif; letter-spacing: 1.6px; }
    .ttl  { font: 600 15.5px "Segoe UI","PT Sans","Noto Sans",Arial,sans-serif; fill: #0f2d69; }
    .ttlh { font: 600 15.5px "Segoe UI","PT Sans","Noto Sans",Arial,sans-serif; fill: #c0272d; }
    .sub  { font: 400 11.5px "Segoe UI","PT Sans","Noto Sans",Arial,sans-serif; fill: #5b657a; }
    .wire { font: 600 11.5px "Cascadia Code",Consolas,"DejaVu Sans Mono",monospace; fill: #2b4a8b; }
    .edge  { fill: none; stroke: #2b4a8b; stroke-width: 2; }
    .inner { fill: none; stroke: #7fa3d6; stroke-width: 1.8; }
  </style>

  <defs>
    <marker id="a" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="8" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 4 L0 8 z" fill="#2b4a8b"/>
    </marker>
    <marker id="b" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 4 L0 8 z" fill="#7fa3d6"/>
    </marker>
  </defs>

